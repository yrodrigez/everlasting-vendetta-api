services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev-api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - BLIZZARD_CLIENT_ID=${BLIZZARD_CLIENT_ID}
      - BLIZZARD_CLIENT_SECRET=${BLIZZARD_CLIENT_SECRET}
      - BLIZZARD_REGION=${BLIZZARD_REGION:-eu}
      - BLIZZARD_LOCALE=${BLIZZARD_LOCALE:-en_US}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - JWT_EV_PRIVATE_KEY=${JWT_EV_PRIVATE_KEY}
      - JWT_EV_REFRESH_PRIVATE_KEY=${JWT_EV_REFRESH_PRIVATE_KEY}
      - JWT_EV_ANON_KEY=${JWT_EV_ANON_KEY}
      - JWT_EV_KID=${JWT_EV_KID}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - TZ=Europe/Madrid
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Development mode with hot reload
  api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: ev-api-dev
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src:ro
    environment:
      - NODE_ENV=development
      - PORT=8080
      - TZ=Europe/Madrid
    env_file:
      - .env
    command: ["npx", "tsx", "watch", "src/server.ts"]
    profiles:
      - dev
