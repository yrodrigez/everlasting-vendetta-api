services:
    api:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ev-api
        ports:
            - "8080:8080"
        environment:
            - NODE_ENV=production
            - PORT=8080
            - SUPABASE_URL=${SUPABASE_URL}
            - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            - BLIZZARD_CLIENT_ID=${BLIZZARD_CLIENT_ID}
            - BLIZZARD_CLIENT_SECRET=${BLIZZARD_CLIENT_SECRET}
            - BLIZZARD_REGION=${BLIZZARD_REGION:-eu}
            - BLIZZARD_LOCALE=${BLIZZARD_LOCALE:-en_US}
            - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
            - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
            - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
            - JWT_EV_PRIVATE_KEY=${JWT_EV_PRIVATE_KEY}
            - JWT_EV_REFRESH_PRIVATE_KEY=${JWT_EV_REFRESH_PRIVATE_KEY}
            - JWT_EV_ANON_KEY=${JWT_EV_ANON_KEY}
            - JWT_EV_KID=${JWT_EV_KID}
            - ENVIRONMENT=${ENVIRONMENT:-development}
            - TZ=Europe/Madrid
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - REDIS_HOST=${REDIS_HOST}
            - REDIS_PORT=${REDIS_PORT}
        env_file:
            - .env
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--no-verbose",
                    "--tries=1",
                    "--spider",
                    "http://localhost:8080/",
                ]
            interval: 30s
            timeout: 3s
            start_period: 5s
            retries: 3
        depends_on:
            - redis
        networks:
            - app_network

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        volumes:
            - redis_data:/data
        networks:
            - app_network

    redisinsight:
        image: redis/redisinsight:latest
        container_name: redisinsight
        ports:
            - "5540:5540"
        depends_on:
            - redis
        networks:
            - app_network

volumes:
    redis_data:

networks:
    app_network:
